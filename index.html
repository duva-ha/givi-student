    <style>
        /* TỐI ƯU GIAO DIỆN MOBILE & CHỮ TO */
        :root {
            --font-main: 18px; /* Kích thước chữ cơ bản to hơn bình thường */
        }

        body {
            font-size: var(--font-main);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Tăng cỡ chữ cho các vùng quan trọng của React App */
        #root {
            min-height: 100vh;
        }

        /* Chữ trong câu hỏi (Sẽ áp dụng nếu bạn đặt class này trong QuizModal) */
        .quiz-text-large {
            font-size: 1.35rem !important;
            line-height: 1.6;
            font-weight: 600;
        }

        /* Lớp bảo mật Watermark */
        #security-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            opacity: 0.06;
            overflow: hidden;
        }

        .watermark {
            transform: rotate(-30deg);
            font-size: 14px;
            font-weight: bold;
            color: #000;
            margin: 40px;
            white-space: nowrap;
        }

        /* Tối ưu nút bấm cho ngón tay trên điện thoại */
        button {
            touch-action: manipulation;
            min-height: 44px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="security-layer">
        </div>

    <div id="root"></div>

    <script type="text/babel" src="App.js"></script>

    <script>
        // 1. Tự động tạo Watermark dày đặc phủ màn hình
        const securityLayer = document.getElementById('security-layer');
        for (let i = 0; i < 60; i++) {
            const span = document.createElement('div');
            span.className = 'watermark';
            span.innerText = 'E-TECH HUB 2026';
            securityLayer.appendChild(span);
        }

        // 2. Biến theo dõi gian lận
        let violationCount = 0;
        const MAX_VIOLATIONS = 3;

        // 3. Phát hiện thoát màn hình / Chuyển Tab / Chụp màn hình (làm mất focus)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                violationCount++;
                
                if (violationCount >= MAX_VIOLATIONS) {
                    alert("CẢNH BÁO NGUY HIỂM: Bạn đã thoát màn hình quá 3 lần. Hành vi này đã được gửi về hệ thống giám sát!");
                    // Bạn có thể thêm lệnh tự động nộp bài ở đây
                } else {
                    alert(`CẢNH BÁO: Không được rời khỏi ứng dụng khi đang làm bài!\nVi phạm lần: ${violationCount}/${MAX_VIOLATIONS}`);
                }
            }
        });

        // 4. Chặn phím tắt (Cho trường hợp dùng máy tính/iPad có bàn phím)
        window.addEventListener('keydown', function(e) {
            // Chặn F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S, Ctrl+P
            const forbiddenKeys = [123, 73, 74, 67, 85, 83, 80];
            if (forbiddenKeys.includes(e.keyCode) || (e.ctrlKey && (forbiddenKeys.includes(e.keyCode)))) {
                e.preventDefault();
                return false;
            }
        });

        // 5. Chặn Copy/Paste
        document.addEventListener('copy', (e) => {
            e.preventDefault();
            alert("Vì lý do bảo mật, bạn không thể sao chép nội dung!");
        });

        document.addEventListener('paste', (e) => {
            e.preventDefault();
        });

        // 6. Ngăn chặn tự động zoom khi focus vào ô nhập liệu (Mobile optimization)
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
