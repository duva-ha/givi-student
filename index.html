<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* TỐI ƯU HÓA TRẢI NGHIỆM DI ĐỘNG (MOBILE-FIRST) */
        :root {
            --primary-font: 20px; /* Chữ cực to cho điện thoại */
        }

        body {
            font-size: var(--primary-font);
            background-color: #ffffff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Chống chọn văn bản để copy */
            user-select: none;
            -webkit-user-select: none;
            /* Loại bỏ bóng mờ khi chạm trên mobile */
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Đảm bảo App React chiếm trọn màn hình điện thoại */
        #root {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Watermark bảo mật - Phủ dày hơn để AI không đọc được */
        #security-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            opacity: 0.08;
        }
        .watermark {
            transform: rotate(-25deg);
            font-size: 12px;
            font-weight: bold;
            margin: 30px 10px;
            white-space: nowrap;
        }

        /* Tối ưu hóa các thành phần UI Mobile */
        .mobile-card {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
        }

        /* Chữ câu hỏi siêu to */
        .quiz-question-mobile {
            font-size: 1.5rem !important;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #000;
        }

        /* Đáp án dạng nút lớn dễ bấm */
        .quiz-option-mobile {
            padding: 16px !important;
            margin-bottom: 12px !important;
            font-size: 1.2rem !important;
            border-radius: 10px !important;
            background: #f3f4f6;
            display: block;
            width: 100%;
        }

        /* Cố định Header trên mobile để không bị trôi khi cuộn */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="security-layer"></div>

    <div id="root"></div>

    <script type="text/babel" src="App.js"></script>

    <script>
        // 1. Tạo Watermark động
        const layer = document.getElementById('security-layer');
        for (let i = 0; i < 80; i++) {
            const div = document.createElement('div');
            div.className = 'watermark';
            div.innerText = 'E-TECH HUB 2026';
            layer.appendChild(div);
        }

        // 2. Logic chống gian lận tập trung vào Mobile
        let violations = 0;
        const MAX_ALLOWED = 3;

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                violations++;
                // Mobile thường chụp màn hình bằng cách nhấn tổ hợp phím làm trình duyệt mất focus tạm thời
                if (violations >= MAX_ALLOWED) {
                    alert("CẢNH BÁO: Bạn vi phạm quá nhiều lần. Hệ thống đã ghi nhận tên và mã số học sinh!");
                } else {
                    alert("CẢNH BÁO: Không được thoát ứng dụng hoặc chụp màn hình!\nSố lần vi phạm: " + violations + "/" + MAX_ALLOWED);
                }
            }
        });

        // 3. Chặn Copy/Paste/Select
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('paste', (e) => e.preventDefault());

        // 4. Cải thiện tốc độ phản hồi trên Mobile (Loại bỏ độ trễ 300ms khi click)
        if ('addEventListener' in document) {
            document.addEventListener('DOMContentLoaded', function() {
                // Có thể thêm FastClick ở đây nếu cần hỗ trợ máy cũ
            }, false);
        }
    </script>
</body>
</html>
