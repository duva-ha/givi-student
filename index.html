<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

    <script src="BG10/bai2-10.js"></script>
    <script src="BG10/bai3-10.js"></script>

    <script type="text/babel" src="Sidebar.js"></script>
    <script type="text/babel" src="Header.js"></script>

    <style>
        /* THIẾT KẾ SIÊU TO CHO ĐIỆN THOẠI (GIẢM THIỂU NỘI DUNG THỪA) */
        :root {
            --font-question: 32px; /* Chữ câu hỏi to gấp đôi */
            --font-option: 24px;   /* Chữ đáp án cực rõ */
        }

        body {
            font-size: 20px;
            background-color: #ffffff;
            color: #000;
            font-family: -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Tối ưu hóa vùng làm bài từng câu */
        .quiz-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Câu hỏi: To, đậm, nổi bật */
        .quiz-question-mobile {
            font-size: var(--font-question) !important;
            font-weight: 800 !important;
            line-height: 1.3;
            color: #1a202c;
            margin-bottom: 20px;
            border-left: 8px solid #3b82f6;
            padding-left: 15px;
        }

        /* Đáp án: Dạng thẻ lớn, chữ to, dễ chạm */
        .quiz-option-mobile {
            font-size: var(--font-option) !important;
            padding: 20px !important;
            margin-bottom: 15px !important;
            border: 3px solid #e2e8f0 !important;
            border-radius: 15px !important;
            background: #fff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            text-align: left;
            font-weight: 500;
        }

        .quiz-option-mobile:active {
            background-color: #ebf8ff;
            border-color: #3b82f6 !important;
        }

        /* Lớp bảo mật Watermark */
        #security-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            opacity: 0.1; /* Tăng nhẹ độ đậm để chống AI quét */
        }
        .watermark {
            transform: rotate(-25deg);
            font-size: 14px;
            font-weight: bold;
            margin: 40px 10px;
        }

        /* Nút điều hướng (Câu trước/Câu sau) */
        .nav-button {
            font-size: 22px !important;
            padding: 15px 30px !important;
            font-weight: bold !important;
            border-radius: 50px !important;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="security-layer"></div>

    <div id="root"></div>

    <script type="text/babel" src="App.js"></script>

    <script>
        // Watermark động dày đặc
        const layer = document.getElementById('security-layer');
        for (let i = 0; i < 100; i++) {
            const div = document.createElement('div');
            div.className = 'watermark';
            div.innerText = 'E-TECH HUB 2026';
            layer.appendChild(div);
        }

        // Hệ thống cảnh báo thoát trang
        let violations = 0;
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                violations++;
                if (violations >= 3) {
                    alert("CẢNH BÁO: Bạn đã thoát màn hình 3 lần. Hệ thống sẽ khóa bài làm!");
                } else {
                    alert(`KHÔNG ĐƯỢC THOÁT RA! \nVi phạm lần: ${violations}/3 \nMọi hành động chụp màn hình đều bị ghi lại.`);
                }
            }
        });

        // Chặn các phím tắt và thao tác sao chép
        document.addEventListener('copy', e => e.preventDefault());
        window.onkeydown = e => {
            if ([123, 85, 83, 80].includes(e.keyCode) || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode))) return false;
        };
    </script>
</body>
</html>
