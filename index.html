    <style>
        /* TỐI ƯU CỠ CHỮ CỰC ĐẠI CHO MOBILE */
        :root {
            --font-q: 36px; /* Chữ câu hỏi siêu to */
            --font-o: 26px; /* Chữ đáp án siêu rõ */
        }

        body {
            margin: 0; padding: 0;
            background-color: #f8fafc;
            font-family: -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* Chống cuộn toàn trang để mượt như App */
        }

        /* Class chữ to dùng trong QuizModal.js */
        .quiz-question-mobile {
            font-size: var(--font-q) !important;
            font-weight: 900 !important;
            line-height: 1.25 !important;
            color: #000;
            margin-bottom: 25px !important;
        }

        .quiz-option-mobile {
            font-size: var(--font-o) !important;
            font-weight: 600 !important;
            padding: 22px 18px !important;
            border: 3px solid #e2e8f0 !important;
            border-radius: 18px !important;
            width: 100% !important;
            text-align: left;
            margin-bottom: 12px !important;
            background: white;
            display: flex;
            align-items: center;
        }

        /* Lớp bảo mật Watermark chống chụp ảnh/AI quét chữ */
        #security-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            opacity: 0.12;
        }
        .watermark {
            transform: rotate(-30deg);
            font-size: 14px;
            font-weight: bold;
            color: #666;
            margin: 45px 5px;
            text-align: center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="security-layer"></div>

    <div id="root"></div>

    <script type="text/babel" src="App.js"></script>

    <script>
        // 1. Tự động tạo Watermark dày đặc phủ toàn màn hình
        const layer = document.getElementById('security-layer');
        for (let i = 0; i < 90; i++) {
            const div = document.createElement('div');
            div.className = 'watermark';
            div.innerText = 'E-TECH HUB 2026';
            layer.appendChild(div);
        }

        // 2. Hệ thống cảnh báo gian lận (Chống thoát màn hình/AI)
        let violations = 0;
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                violations++;
                // Alert làm gián đoạn hành vi dùng AI của HS
                alert(`CẢNH BÁO GIAN LẬN!\nSố lần thoát màn hình: ${violations}/3.\nHệ thống sẽ ghi nhận vi phạm nếu vượt quá giới hạn.`);
            }
        });

        // 3. Chống sao chép văn bản để dán vào công cụ giải bài AI
        document.addEventListener('copy', (e) => {
            e.preventDefault();
            alert("Không được phép sao chép nội dung thi!");
        });

        // 4. Vô hiệu hóa phím tắt (nếu HS dùng máy tính hoặc bàn phím rời)
        window.addEventListener('keydown', function(e) {
            if ([123, 85, 83, 80].includes(e.keyCode) || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode))) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
