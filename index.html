    <style>
        /* THIẾT LẬP SIÊU CẬP NHẬT CHO MOBILE */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #fff;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 1. Câu hỏi chiếm gần hết chiều ngang, chữ cực to */
        .quiz-question-mobile {
            font-size: 38px !important; /* To gấp đôi hiện tại */
            font-weight: 900 !important;
            line-height: 1.2 !important;
            color: #111;
            padding: 15px 10px !important;
            margin: 0 0 20px 0 !important;
            border-bottom: 4px solid #3b82f6;
            width: 100% !important;
            display: block;
        }

        /* 2. Đáp án: To như cái thớt, chạm cực dễ */
        .quiz-option-mobile {
            font-size: 28px !important; /* Tăng từ 16px lên 28px */
            font-weight: 600 !important;
            padding: 25px 15px !important;
            margin-bottom: 15px !important;
            border: 4px solid #000 !important; /* Viền đen cho rõ nét */
            border-radius: 12px !important;
            background: #fff;
            display: flex;
            align-items: center;
            width: 100% !important;
            text-align: left;
            box-shadow: 4px 4px 0px #000; /* Hiệu ứng nổi bật */
        }

        /* Hiệu ứng khi chọn */
        .quiz-option-mobile:active {
            background-color: #3b82f6 !important;
            color: #fff !important;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* 3. Loại bỏ các khoảng trắng dư thừa của Container */
        .modal-content, #quiz-content {
            padding: 10px !important;
            max-width: 100% !important;
            margin: 0 !important;
        }

        /* Watermark bảo mật */
        #security-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            opacity: 0.12;
        }
        .watermark {
            transform: rotate(-25deg);
            font-size: 16px;
            font-weight: bold;
            margin: 45px 5px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="security-layer"></div>
    <div id="root"></div>

    <script type="text/babel" src="App.js"></script>

    <script>
        // Tạo Watermark
        const layer = document.getElementById('security-layer');
        for (let i = 0; i < 100; i++) {
            const div = document.createElement('div');
            div.className = 'watermark';
            div.innerText = 'E-TECH HUB 2026';
            layer.appendChild(div);
        }

        // Chống gian lận
        let violations = 0;
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                violations++;
                alert(`CẢNH BÁO: Vi phạm lần ${violations}/3. Không được thoát màn hình!`);
            }
        });

        // Chặn copy
        document.addEventListener('copy', e => e.preventDefault());
    </script>
</body>
</html>
